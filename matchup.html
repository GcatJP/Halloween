<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Match up</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#2a1250" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Halloween" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="images/icon.png" />
    <link rel="icon" type="image/png" href="images/icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg1: #2a1250;
        --bg2: #4a1c78;
        --bg3: #7a2f8f;
        --orange: #ff9a1f;
        --yellow: #ffe066;
        --white: #fff8ee;
        --green: #58d46a;
        --font:
          "Fredoka", "Chalkboard SE", "Hiragino Maru Gothic ProN",
          "Comic Sans MS", system-ui, sans-serif;
        --top: calc(env(safe-area-inset-top, 0px) + 70px);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--bg1);
        font-family: var(--font);
        color: var(--white);
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
      }
      body {
        background: radial-gradient(
          circle at 50% 0%,
          var(--bg3) 0%,
          var(--bg2) 40%,
          var(--bg1) 100%
        );
      }

      /* ---------- decorations ---------- */
      .star {
        position: fixed;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fff;
        opacity: 0.7;
        animation: twinkle 3s infinite ease-in-out;
        z-index: 0;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.2;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.3);
        }
      }

      /* ---------- top buttons ---------- */
      .round {
        position: fixed;
        z-index: 30;
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        width: clamp(46px, 8vmin, 60px);
        height: clamp(46px, 8vmin, 60px);
        border-radius: 50%;
        border: 3px solid #fff;
        background: var(--orange);
        font-size: clamp(22px, 4.2vmin, 32px);
        cursor: pointer;
        color: #fff;
        font-family: var(--font);
        font-weight: 700;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .round:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }
      #back {
        left: calc(env(safe-area-inset-left, 0px) + 12px);
      }
      #mute {
        right: calc(env(safe-area-inset-right, 0px) + 12px);
      }
      #mute.off {
        background: #6b5a85;
      }

      /* ---------- screens ---------- */
      .screen {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: var(--top) calc(env(safe-area-inset-right, 0px) + 14px)
          calc(env(safe-area-inset-bottom, 0px) + 12px)
          calc(env(safe-area-inset-left, 0px) + 14px);
        gap: 3vmin;
        text-align: center;
      }
      .screen.active {
        display: flex;
      }
      h1 {
        font-size: clamp(30px, 8vmin, 64px);
        line-height: 1.05;
        color: var(--orange);
        font-weight: 700;
        text-shadow:
          0 3px 0 #7a2f00,
          0 0 24px rgba(255, 154, 31, 0.5);
      }
      .sub {
        font-size: clamp(16px, 3.6vmin, 28px);
        color: var(--yellow);
        font-weight: 500;
      }

      .choices {
        display: flex;
        gap: clamp(12px, 3vmin, 28px);
        flex-wrap: wrap;
        justify-content: center;
        width: min(94vw, 900px);
      }
      .big {
        font-family: var(--font);
        color: #fff;
        cursor: pointer;
        border: 4px solid rgba(255, 255, 255, 0.9);
        border-radius: clamp(20px, 4vmin, 34px);
        padding: clamp(12px, 2.6vmin, 26px) clamp(18px, 4vmin, 40px);
        min-width: clamp(150px, 30vmin, 260px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6vmin;
        box-shadow:
          0 8px 0 rgba(0, 0, 0, 0.35),
          0 14px 26px rgba(0, 0, 0, 0.3);
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      .big:active {
        transform: translateY(6px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
      }
      .big b {
        font-size: clamp(24px, 5.4vmin, 46px);
        font-weight: 700;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
      }
      .big small {
        font-size: clamp(13px, 2.6vmin, 21px);
        font-weight: 500;
        opacity: 0.95;
      }
      .big .pics {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: clamp(18px, 3.6vmin, 30px);
        font-weight: 700;
      }
      .big .pics img {
        height: clamp(34px, 8vmin, 64px);
        width: auto;
        filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.35));
      }
      .big .pics .w {
        background: #fff;
        color: #4a1c78;
        border-radius: 10px;
        padding: 2px 10px;
        font-size: clamp(14px, 3vmin, 24px);
      }
      .easy {
        background: linear-gradient(160deg, #6fdc6f, #2a9d43);
      }
      .hard {
        background: linear-gradient(160deg, #a66bff, #6a35c9);
      }
      .l1 {
        background: linear-gradient(160deg, #6fdc6f, #2a9d43);
      }
      .l2 {
        background: linear-gradient(160deg, #ffb23f, #f0720a);
      }
      .l3 {
        background: linear-gradient(160deg, #ff7b7b, #d4393f);
      }

      /* ---------- game ---------- */
      #game {
        justify-content: flex-start;
        gap: 1.2vmin;
        padding-top: calc(var(--top) - 8px);
      }
      #hud {
        display: flex;
        gap: clamp(10px, 3vmin, 30px);
        align-items: center;
        justify-content: center;
        font-size: clamp(15px, 3.2vmin, 26px);
        font-weight: 700;
        color: var(--yellow);
      }
      #hud span {
        background: rgba(0, 0, 0, 0.25);
        border-radius: 30px;
        padding: 3px 16px;
      }
      #board {
        position: relative;
        flex: 1;
        width: 100%;
        min-height: 0;
      }
      #grid {
        position: absolute;
        inset: 0;
        display: grid;
        justify-content: center;
        align-content: center;
      }
      .card {
        perspective: 700px;
        cursor: pointer;
      }
      .inner {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.45s;
        transform-style: preserve-3d;
      }
      .card.flipped .inner {
        transform: rotateY(180deg);
      }
      .side {
        position: absolute;
        inset: 0;
        border-radius: 14%/12%;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 3px solid #fff;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
      }
      .cover {
        background: linear-gradient(160deg, #ff9a1f, #e8650a);
        font-size: calc(var(--cw) * 0.5);
      }
      .cover::after {
        content: "🎃";
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.3));
      }
      .face {
        background: #fffaf0;
        transform: rotateY(180deg);
        color: #3a1a60;
      }
      .face img {
        width: 86%;
        height: 86%;
        object-fit: contain;
        pointer-events: none;
      }
      .face .txt {
        font-weight: 700;
        text-align: center;
        line-height: 1.05;
        padding: 4px;
        font-size: max(11px, calc(var(--cw) * 0.17));
      }
      .card.matched .face {
        background: #e8ffe8;
        border-color: var(--green);
        box-shadow: 0 0 14px 4px rgba(88, 212, 106, 0.8);
      }
      .card.matched .inner {
        animation: pop 0.5s;
      }
      @keyframes pop {
        0% {
          transform: rotateY(180deg) scale(1);
        }
        50% {
          transform: rotateY(180deg) scale(1.12);
        }
        100% {
          transform: rotateY(180deg) scale(1);
        }
      }
      .card.wrong .face {
        border-color: #ff7b7b;
      }

      /* ---------- win ---------- */
      #win {
        position: fixed;
        inset: 0;
        z-index: 25;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 2.4vmin;
        background: rgba(30, 10, 60, 0.88);
        text-align: center;
        padding: 20px;
        overflow: hidden;
      }
      #win.show {
        display: flex;
      }
      #win h2 {
        font-size: clamp(34px, 9vmin, 72px);
        color: var(--orange);
        text-shadow: 0 3px 0 #7a2f00;
      }
      #win p {
        font-size: clamp(18px, 4vmin, 32px);
        color: var(--yellow);
        font-weight: 700;
      }
      #win .choices .big {
        min-width: clamp(120px, 22vmin, 200px);
        padding: clamp(10px, 2vmin, 18px) clamp(14px, 3vmin, 30px);
      }
      .fall {
        position: absolute;
        top: -60px;
        font-size: clamp(24px, 5vmin, 44px);
        animation: fall linear forwards;
        pointer-events: none;
      }
      @keyframes fall {
        to {
          transform: translateY(115vh) rotate(360deg);
        }
      }

      @media (orientation: landscape) and (max-height: 500px) {
        .screen {
          gap: 1.6vh;
        }
        h1 {
          font-size: clamp(24px, 10vh, 50px);
        }
        .sub {
          font-size: clamp(13px, 5vh, 22px);
        }
      }
    </style>
  </head>
  <body>
    <div id="sky"></div>

    <button id="back" class="round" aria-label="Back">&#8592;</button>
    <button
      id="mute"
      class="round"
      aria-label="Mute music"
      title="Music on/off"
    >
      🔊
    </button>

    <!-- screen 1: mode -->
    <section id="modeScreen" class="screen active">
      <h1>Match up!</h1>
      <div class="sub">Choose a mode</div>
      <div class="choices">
        <button class="big easy" id="btnEasy">
          <div class="pics">
            <img src="images/ghost.png" alt="" /><span>=</span
            ><img src="images/ghost.png" alt="" />
          </div>
          <b>Easy</b><small>Match the pictures</small>
        </button>
        <button class="big hard" id="btnHard">
          <div class="pics">
            <img src="images/pumpkin.png" alt="" /><span>=</span
            ><span class="w">pumpkin</span>
          </div>
          <b>Difficult</b><small>Match picture + word</small>
        </button>
      </div>
    </section>

    <!-- screen 2: level -->
    <section id="levelScreen" class="screen">
      <h1 id="levelTitle">Choose a level</h1>
      <div class="sub" id="levelSub"></div>
      <div class="choices">
        <button class="big l1" data-level="1">
          <b>Level 1</b><small>6 pairs</small>
        </button>
        <button class="big l2" data-level="2">
          <b>Level 2</b><small>10 pairs</small>
        </button>
        <button class="big l3" data-level="3">
          <b>Level 3</b><small>18 pairs</small>
        </button>
      </div>
    </section>

    <!-- screen 3: game -->
    <section id="game" class="screen">
      <div id="hud">
        <span id="hudLevel">Level 1</span><span id="hudPairs">Pairs 0/6</span
        ><span id="hudMoves">Moves 0</span>
      </div>
      <div id="board"><div id="grid"></div></div>
    </section>

    <!-- win -->
    <div id="win">
      <h2>Great job! 🎉</h2>
      <p id="winText"></p>
      <div class="choices">
        <button class="big l2" id="btnAgain"><b>Play again</b></button>
        <button class="big l1" id="btnNext"><b>Next level</b></button>
        <button class="big hard" id="btnLevels"><b>Levels</b></button>
      </div>
    </div>

    <script>
      /* ===== settings ===== */
      var MUSIC_VOLUME = 0.1; // background music level (0 to 1)
      var SFX_VOLUME = 0.22; // sound effects level
      var TEMPO_BPM = 112;
      var CARD_RATIO = 1.12; // card height / width
      var FLIP_BACK_MS = 900; // how long a wrong pair stays visible

      /* name shown on word cards, image file inside the images folder */
      var ITEMS = [
        ["witch", "witch.png"],
        ["ghost", "ghost.png"],
        ["pumpkin", "pumpkin.png"],
        ["skeleton", "skeleton.png"],
        ["vampire", "vampire.png"],
        ["black cat", "black-cat.png"],
        ["werewolf", "werewolf.png"],
        ["spider", "spider.png"],
        ["zombie", "zombie.png"],
        ["bat", "bat.png"],
        ["haunted house", "haunted-house.png"],
        ["monster", "monster.png"],
        ["mummy", "mummy.png"],
        ["spider web", "spider-web.png"],
        ["scary", "scary.png"],
        ["crow", "crow.png"],
        ["owl", "owl.png"],
        ["moon", "moon.png"],
      ];
      var LEVEL_PAIRS = { 1: 6, 2: 10, 3: 18 };
      var IMG_FOLDER = "images/";

      /* ===== stars ===== */
      (function () {
        var sky = document.getElementById("sky");
        for (var i = 0; i < 26; i++) {
          var s = document.createElement("div");
          s.className = "star";
          s.style.left = Math.random() * 100 + "vw";
          s.style.top = Math.random() * 90 + "vh";
          s.style.animationDelay = -Math.random() * 3 + "s";
          sky.appendChild(s);
        }
      })();

      /* ===== mute state (shared with the index page) ===== */
      var muted = false;
      try {
        muted = localStorage.getItem("halloweenMuted") === "1";
      } catch (e) {}
      var muteBtn = document.getElementById("mute");
      function showMute() {
        muteBtn.textContent = muted ? "🔇" : "🔊";
        muteBtn.classList.toggle("off", muted);
        muteBtn.setAttribute(
          "aria-label",
          muted ? "Unmute music" : "Mute music",
        );
      }
      showMute();

      /* ===== audio ===== */
      var ctx = null,
        master = null,
        sfxGain = null,
        timer = null,
        started = false;
      var events = [],
        evIndex = 0,
        loopStart = 0,
        beat = 60 / TEMPO_BPM,
        LOOP_BEATS = 32;
      function hz(m) {
        return 440 * Math.pow(2, (m - 69) / 12);
      }

      (function buildSong() {
        // playful D minor tune: 8 bars of 4 beats
        var roots = [50, 50, 46, 45, 50, 50, 46, 45];
        var chords = [
          [62, 65, 69],
          [62, 65, 69],
          [62, 65, 70],
          [61, 64, 69],
          [62, 65, 69],
          [62, 65, 69],
          [62, 65, 70],
          [61, 64, 69],
        ];
        for (var b = 0; b < 8; b++) {
          var t = b * 4;
          events.push({ t: t, m: [roots[b]], d: 0.9, v: 0.6, w: "sine" });
          events.push({
            t: t + 2,
            m: [roots[b] + 7],
            d: 0.9,
            v: 0.5,
            w: "sine",
          });
          events.push({
            t: t + 1,
            m: chords[b],
            d: 0.4,
            v: 0.16,
            w: "triangle",
          });
          events.push({
            t: t + 3,
            m: chords[b],
            d: 0.4,
            v: 0.16,
            w: "triangle",
          });
        }
        var mel = [
          [0, 74, 0.5],
          [0.5, 77, 0.5],
          [1, 81, 1],
          [2, 77, 0.5],
          [2.5, 74, 0.5],
          [3, 76, 1],
          [4, 77, 0.5],
          [4.5, 76, 0.5],
          [5, 74, 0.5],
          [5.5, 72, 0.5],
          [6, 74, 2],
          [8, 70, 0.5],
          [8.5, 74, 0.5],
          [9, 77, 1],
          [10, 76, 0.5],
          [10.5, 74, 0.5],
          [11, 72, 1],
          [12, 73, 0.5],
          [12.5, 76, 0.5],
          [13, 81, 1],
          [14, 79, 1],
          [15, 77, 1],
          [16, 74, 0.5],
          [16.5, 77, 0.5],
          [17, 81, 1],
          [18, 84, 0.5],
          [18.5, 81, 0.5],
          [19, 77, 1],
          [20, 79, 0.5],
          [20.5, 77, 0.5],
          [21, 76, 0.5],
          [21.5, 74, 0.5],
          [22, 77, 2],
          [24, 74, 0.5],
          [24.5, 72, 0.5],
          [25, 70, 1],
          [26, 72, 0.5],
          [26.5, 74, 0.5],
          [27, 77, 1],
          [28, 76, 1],
          [29, 73, 1],
          [30, 74, 2],
        ];
        mel.forEach(function (n) {
          events.push({
            t: n[0],
            m: [n[1]],
            d: n[2] * 0.9,
            v: 0.42,
            w: "triangle",
            pluck: true,
          });
        });
        events.sort(function (a, b) {
          return a.t - b.t;
        });
      })();

      function playNote(freq, when, durBeats, vol, wave, pluck) {
        var dur = durBeats * beat;
        var o = ctx.createOscillator(),
          g = ctx.createGain();
        o.type = wave;
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, when);
        g.gain.linearRampToValueAtTime(vol, when + 0.012);
        g.gain.exponentialRampToValueAtTime(
          0.0001,
          when + dur + (pluck ? 0.18 : 0.25),
        );
        o.connect(g);
        g.connect(master);
        o.start(when);
        o.stop(when + dur + 0.4);
      }
      function schedule() {
        if (!ctx) return;
        while (true) {
          var e = events[evIndex];
          var when = loopStart + e.t * beat;
          if (when > ctx.currentTime + 0.5) break;
          if (when >= ctx.currentTime - 0.05) {
            for (var i = 0; i < e.m.length; i++)
              playNote(hz(e.m[i]), when, e.d, e.v, e.w, e.pluck);
          }
          evIndex++;
          if (evIndex >= events.length) {
            evIndex = 0;
            loopStart += LOOP_BEATS * beat;
          }
        }
      }
      function startMusic() {
        if (started) {
          if (ctx && ctx.state === "suspended") ctx.resume();
          return;
        }
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = muted ? 0 : MUSIC_VOLUME;
        master.connect(ctx.destination);
        sfxGain = ctx.createGain();
        sfxGain.gain.value = muted ? 0 : SFX_VOLUME;
        sfxGain.connect(ctx.destination);
        loopStart = ctx.currentTime + 0.2;
        evIndex = 0;
        timer = setInterval(schedule, 100);
        started = true;
        if (ctx.state === "suspended") ctx.resume();
      }
      /* music starts on the first tap anywhere (browsers need a tap) */
      function firstTap() {
        document.removeEventListener("click", firstTap, true);
        document.removeEventListener("touchend", firstTap, true);
        if (!muted) startMusic();
      }
      document.addEventListener("click", firstTap, true);
      document.addEventListener("touchend", firstTap, true);

      muteBtn.addEventListener("click", function () {
        muted = !muted;
        try {
          localStorage.setItem("halloweenMuted", muted ? "1" : "0");
        } catch (e) {}
        showMute();
        if (!muted && !started) startMusic();
        if (ctx) {
          master.gain.setTargetAtTime(
            muted ? 0 : MUSIC_VOLUME,
            ctx.currentTime,
            0.05,
          );
          sfxGain.gain.setTargetAtTime(
            muted ? 0 : SFX_VOLUME,
            ctx.currentTime,
            0.05,
          );
        }
      });
      document.addEventListener("visibilitychange", function () {
        if (!ctx) return;
        if (document.hidden) ctx.suspend();
        else ctx.resume();
      });

      function blip(freq, delay, dur, type) {
        if (!ctx || muted) return;
        var t = ctx.currentTime + (delay || 0);
        var o = ctx.createOscillator(),
          g = ctx.createGain();
        o.type = type || "sine";
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(1, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g);
        g.connect(sfxGain);
        o.start(t);
        o.stop(t + dur + 0.05);
      }
      function sfxFlip() {
        blip(520, 0, 0.08, "triangle");
      }
      function sfxMatch() {
        blip(660, 0, 0.15, "triangle");
        blip(880, 0.12, 0.25, "triangle");
      }
      function sfxWrong() {
        blip(260, 0, 0.18, "sine");
        blip(200, 0.12, 0.22, "sine");
      }
      function sfxWin() {
        [523, 659, 784, 1047, 784, 1047].forEach(function (f, i) {
          blip(f, i * 0.14, 0.3, "triangle");
        });
      }

      /* ===== screens / navigation ===== */
      var screens = { mode: "modeScreen", level: "levelScreen", game: "game" };
      var current = "mode";
      function show(name) {
        current = name;
        for (var k in screens)
          document
            .getElementById(screens[k])
            .classList.toggle("active", k === name);
        document.getElementById("win").classList.remove("show");
        clearConfetti();
      }
      var mode = "easy",
        level = 1;

      function goModes() {
        show("mode");
      }
      function goLevels() {
        document.getElementById("levelSub").textContent =
          mode === "easy"
            ? "Easy: match the pictures"
            : "Difficult: match picture + word";
        show("level");
      }
      document.getElementById("back").addEventListener("click", function () {
        if (current === "game") goLevels();
        else if (current === "level") goModes();
        else location.href = "index.html";
      });
      document.getElementById("btnEasy").addEventListener("click", function () {
        mode = "easy";
        goLevels();
      });
      document.getElementById("btnHard").addEventListener("click", function () {
        mode = "hard";
        goLevels();
      });
      Array.prototype.forEach.call(
        document.querySelectorAll("[data-level]"),
        function (b) {
          b.addEventListener("click", function () {
            startGame(parseInt(b.getAttribute("data-level"), 10));
          });
        },
      );
      document
        .getElementById("btnAgain")
        .addEventListener("click", function () {
          startGame(level);
        });
      document.getElementById("btnNext").addEventListener("click", function () {
        startGame(level + 1);
      });
      document.getElementById("btnLevels").addEventListener("click", goLevels);

      /* ===== game ===== */
      var grid = document.getElementById("grid");
      var deck = [],
        first = null,
        second = null,
        lock = false,
        moves = 0,
        found = 0,
        totalPairs = 0;

      function shuffle(a) {
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;
      }

      function startGame(lv) {
        level = lv;
        totalPairs = LEVEL_PAIRS[lv];
        var picked = shuffle(ITEMS.slice()).slice(0, totalPairs);
        deck = [];
        picked.forEach(function (it) {
          deck.push({ name: it[0], file: it[1], type: "pic" });
          deck.push({
            name: it[0],
            file: it[1],
            type: mode === "easy" ? "pic" : "word",
          });
        });
        shuffle(deck);
        first = second = null;
        lock = false;
        moves = 0;
        found = 0;
        updateHud();
        show("game");
        render();
        layout();
      }

      function updateHud() {
        document.getElementById("hudLevel").textContent = "Level " + level;
        document.getElementById("hudPairs").textContent =
          "Pairs " + found + "/" + totalPairs;
        document.getElementById("hudMoves").textContent = "Moves " + moves;
      }

      function render() {
        grid.innerHTML = "";
        deck.forEach(function (c, i) {
          var el = document.createElement("div");
          el.className = "card";
          var inner =
            '<div class="inner"><div class="side cover"></div><div class="side face">';
          if (c.type === "word") inner += '<div class="txt"></div>';
          else inner += '<img alt="">';
          inner += "</div></div>";
          el.innerHTML = inner;
          if (c.type === "word") el.querySelector(".txt").textContent = c.name;
          else {
            var im = el.querySelector("img");
            im.onerror = function () {
              var d = document.createElement("div");
              d.className = "txt";
              d.textContent = c.name;
              im.parentNode.replaceChild(d, im);
            };
            im.src = IMG_FOLDER + c.file;
          }
          el.addEventListener("click", function () {
            flip(i, el);
          });
          c.el = el;
          grid.appendChild(el);
        });
      }

      function flip(i, el) {
        if (lock || el.classList.contains("flipped")) return;
        el.classList.add("flipped");
        sfxFlip();
        if (first === null) {
          first = i;
          return;
        }
        second = i;
        lock = true;
        moves++;
        updateHud();
        var a = deck[first],
          b = deck[second];
        if (a.name === b.name) {
          setTimeout(function () {
            a.el.classList.add("matched");
            b.el.classList.add("matched");
            sfxMatch();
            found++;
            updateHud();
            first = second = null;
            lock = false;
            if (found === totalPairs) setTimeout(win, 700);
          }, 450);
        } else {
          setTimeout(function () {
            a.el.classList.add("wrong");
            b.el.classList.add("wrong");
            sfxWrong();
          }, 420);
          setTimeout(function () {
            a.el.classList.remove("flipped", "wrong");
            b.el.classList.remove("flipped", "wrong");
            first = second = null;
            lock = false;
          }, FLIP_BACK_MS + 350);
        }
      }

      /* fit the cards to the screen */
      function layout() {
        var board = document.getElementById("board");
        var w = board.clientWidth,
          h = board.clientHeight,
          n = deck.length;
        if (!n || !w || !h) return;
        var gap = n > 20 ? 6 : 10,
          best = 0,
          bestCols = 1;
        for (var cols = 1; cols <= n; cols++) {
          var rows = Math.ceil(n / cols);
          var cw = (w - gap * (cols - 1)) / cols;
          var ch = (h - gap * (rows - 1)) / rows;
          var size = Math.min(cw, ch / CARD_RATIO);
          if (size > best) {
            best = size;
            bestCols = cols;
          }
        }
        best = Math.floor(best);
        grid.style.gap = gap + "px";
        grid.style.gridTemplateColumns =
          "repeat(" + bestCols + "," + best + "px)";
        grid.style.gridAutoRows = Math.floor(best * CARD_RATIO) + "px";
        grid.style.setProperty("--cw", best + "px");
      }
      window.addEventListener("resize", layout);
      window.addEventListener("orientationchange", function () {
        setTimeout(layout, 250);
      });

      /* ===== win ===== */
      function win() {
        sfxWin();
        document.getElementById("winText").textContent =
          "You matched all " + totalPairs + " pairs in " + moves + " moves!";
        document.getElementById("btnNext").style.display =
          level < 3 ? "" : "none";
        document.getElementById("win").classList.add("show");
        confetti();
      }
      function confetti() {
        var box = document.getElementById("win"),
          em = ["🎃", "👻", "🦇", "⭐", "🍬", "🕷️"];
        for (var i = 0; i < 28; i++) {
          var s = document.createElement("div");
          s.className = "fall";
          s.textContent = em[i % em.length];
          s.style.left = Math.random() * 100 + "vw";
          s.style.animationDuration = 3 + Math.random() * 3 + "s";
          s.style.animationDelay = Math.random() * 2 + "s";
          box.appendChild(s);
        }
      }
      function clearConfetti() {
        Array.prototype.forEach.call(
          document.querySelectorAll(".fall"),
          function (n) {
            n.remove();
          },
        );
      }

      /* preload images quietly */
      ITEMS.forEach(function (it) {
        var im = new Image();
        im.src = IMG_FOLDER + it[1];
      });
      ["ghost.png", "pumpkin.png"].forEach(function (f) {
        var im = new Image();
        im.src = IMG_FOLDER + f;
      });
    </script>
  </body>
</html>
