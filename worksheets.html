<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Worksheets</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#2a1250" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Halloween" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="images/icon.png" />
    <link rel="icon" type="image/png" href="images/icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg1: #2a1250;
        --bg2: #4a1c78;
        --bg3: #7a2f8f;
        --orange: #ff9a1f;
        --yellow: #ffe066;
        --white: #fff8ee;
        --font:
          "Fredoka", "Chalkboard SE", "Hiragino Maru Gothic ProN",
          "Comic Sans MS", system-ui, sans-serif;
        --gap: clamp(10px, 2.4vmin, 22px);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--bg1);
        font-family: var(--font);
        color: var(--white);
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
      }
      body {
        background: radial-gradient(
          circle at 50% 0%,
          var(--bg3) 0%,
          var(--bg2) 40%,
          var(--bg1) 100%
        );
      }

      /* ---------- decorations ---------- */
      .star {
        position: fixed;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fff;
        opacity: 0.7;
        animation: twinkle 3s infinite ease-in-out;
        z-index: 0;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.2;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.3);
        }
      }

      /* ---------- top buttons ---------- */
      .round {
        position: fixed;
        z-index: 30;
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        width: clamp(46px, 8vmin, 60px);
        height: clamp(46px, 8vmin, 60px);
        border-radius: 50%;
        border: 3px solid #fff;
        background: var(--orange);
        font-size: clamp(22px, 4.2vmin, 32px);
        cursor: pointer;
        color: #fff;
        font-family: var(--font);
        font-weight: 700;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .round:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }
      #back {
        left: calc(env(safe-area-inset-left, 0px) + 12px);
      }
      #mute {
        right: calc(env(safe-area-inset-right, 0px) + 12px);
      }
      #mute.off {
        background: #6b5a85;
      }

      /* ---------- page ---------- */
      #app {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top, 0px) + 70px)
          calc(env(safe-area-inset-right, 0px) + 14px)
          calc(env(safe-area-inset-bottom, 0px) + 14px)
          calc(env(safe-area-inset-left, 0px) + 14px);
        gap: 2.4vmin;
        text-align: center;
      }
      h1 {
        font-size: clamp(28px, 7vmin, 60px);
        line-height: 1.05;
        color: var(--orange);
        font-weight: 700;
        flex: none;
        text-shadow:
          0 3px 0 #7a2f00,
          0 0 24px rgba(255, 154, 31, 0.5);
      }
      .phrase {
        font-size: clamp(17px, 3.8vmin, 34px);
        font-weight: 700;
        color: var(--yellow);
        line-height: 1.3;
        flex: none;
        background: rgba(0, 0, 0, 0.25);
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 26px;
        padding: clamp(8px, 1.8vmin, 18px) clamp(14px, 3vmin, 30px);
        max-width: min(92vw, 760px);
      }

      /* portrait: 2 + 2 + 1 (the last button sits in the middle) */
      .menu {
        flex: 1 1 auto;
        min-height: 0;
        max-height: 640px;
        width: min(92vw, 560px);
        display: grid;
        gap: var(--gap);
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
      }
      a.card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.8vmin;
        text-decoration: none;
        color: #fff;
        border-radius: clamp(18px, 4vmin, 34px);
        min-height: 0;
        height: 100%;
        padding: clamp(6px, 1.6vmin, 16px);
        border: 4px solid rgba(255, 255, 255, 0.85);
        box-shadow:
          0 8px 0 rgba(0, 0, 0, 0.35),
          0 14px 26px rgba(0, 0, 0, 0.35);
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      a.card:active {
        transform: translateY(6px);
        box-shadow:
          0 2px 0 rgba(0, 0, 0, 0.35),
          0 6px 12px rgba(0, 0, 0, 0.35);
      }
      a.card:nth-child(5) {
        grid-column: 1 / -1;
        justify-self: center;
        width: calc(50% - var(--gap) / 2);
      }
      .card img {
        width: 80%;
        flex: 1 1 0;
        min-height: 0;
        object-fit: contain;
        pointer-events: none;
        filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.35));
        animation: bob 3s ease-in-out infinite;
      }
      .card:nth-child(2) img {
        animation-delay: -1s;
      }
      .card:nth-child(3) img {
        animation-delay: -2s;
      }
      .card:nth-child(4) img {
        animation-delay: -3s;
      }
      .card:nth-child(5) img {
        animation-delay: -4s;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      .card b {
        flex: none;
        font-size: clamp(16px, 3.4vmin, 28px);
        font-weight: 700;
        line-height: 1.1;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
      }
      .c-z {
        background: linear-gradient(160deg, #6fdc6f, #2a9d43);
      }
      .c-m {
        background: linear-gradient(160deg, #ffb23f, #f0720a);
      }
      .c-c {
        background: linear-gradient(160deg, #4fc3f7, #1e7fc4);
      }
      .c-k {
        background: linear-gradient(160deg, #a66bff, #6a35c9);
      }
      .c-f {
        background: linear-gradient(160deg, #ff7eb6, #d63a85);
      }

      /* landscape: all five across */
      @media (orientation: landscape) {
        #app {
          padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
          gap: 2.2vmin;
        }
        h1 {
          font-size: clamp(24px, 9vh, 56px);
        }
        .phrase {
          font-size: clamp(15px, 4.6vh, 30px);
          max-width: calc(100vw - 180px);
        }
        .menu {
          flex: none;
          max-height: none;
          display: flex;
          flex-direction: row;
          width: min(96vw, 1100px);
        }
        a.card {
          flex: 1;
          min-width: 0;
          height: min(46vh, 280px);
        }
        a.card:nth-child(5) {
          grid-column: auto;
          justify-self: auto;
          width: auto;
        }
        .card b {
          font-size: clamp(14px, 4vh, 23px);
        }
      }
    </style>
  </head>
  <body>
    <div id="sky"></div>

    <button id="back" class="round" aria-label="Back">&#8592;</button>
    <button
      id="mute"
      class="round"
      aria-label="Mute music"
      title="Music on/off"
    >
      🔊
    </button>

    <main id="app">
      <h1>Worksheets</h1>
      <div class="phrase">
        Here are some Halloween worksheets for you to print out and enjoy!
      </div>
      <nav class="menu">
        <a class="card c-z" id="w1" target="_blank" rel="noopener"
          ><img src="images/moon.png" alt="" /><b>Worksheets 1</b></a
        >
        <a class="card c-m" id="w2" target="_blank" rel="noopener"
          ><img src="images/mummy.png" alt="" /><b>Worksheets 2</b></a
        >
        <a class="card c-c" id="w3" target="_blank" rel="noopener"
          ><img src="images/crow.png" alt="" /><b>Reading</b></a
        >
        <a class="card c-k" id="w4" target="_blank" rel="noopener"
          ><img src="images/color.png" alt="" /><b>Coloring</b></a
        >
        <a class="card c-f" id="w5" target="_blank" rel="noopener"
          ><img src="images/zombie.png" alt="" /><b>Flashcards</b></a
        >
      </nav>
    </main>

    <script>
      /* ===== where the PDFs are =====
   Same folder as the app:   PDF_BASE = 'pdfs/';
   bunny.net (Pull Zone URL): PDF_BASE = 'https://YOUR-ZONE.b-cdn.net/halloween/';  */
      var PDF_BASE = "https://adventureislandesl.b-cdn.net/halloweed_pdfs/";
      var PDF_FILES = {
        w1: "worksheets-1.pdf",
        w2: "worksheets-2.pdf",
        w3: "halloween-reading.pdf",
        w4: "coloring.pdf",
        w5: "flashcards.pdf",
      };
      Object.keys(PDF_FILES).forEach(function (id) {
        document.getElementById(id).href = PDF_BASE + PDF_FILES[id];
      });
      /* hide an icon quietly if its image file is missing */
      Array.prototype.forEach.call(
        document.querySelectorAll(".card img"),
        function (im) {
          im.onerror = function () {
            im.style.visibility = "hidden";
          };
        },
      );

      /* ===== settings ===== */
      var MUSIC_VOLUME = 0.1; // background music level (0 to 1)
      var SFX_VOLUME = 0.25; // button sound level
      var TEMPO_BPM = 108;

      /* ===== stars ===== */
      (function () {
        var sky = document.getElementById("sky");
        for (var i = 0; i < 26; i++) {
          var s = document.createElement("div");
          s.className = "star";
          s.style.left = Math.random() * 100 + "vw";
          s.style.top = Math.random() * 90 + "vh";
          s.style.animationDelay = -Math.random() * 3 + "s";
          sky.appendChild(s);
        }
      })();

      /* ===== mute state (shared with the other pages) ===== */
      var muted = false;
      try {
        muted = localStorage.getItem("halloweenMuted") === "1";
      } catch (e) {}
      var muteBtn = document.getElementById("mute");
      function showMute() {
        muteBtn.textContent = muted ? "🔇" : "🔊";
        muteBtn.classList.toggle("off", muted);
        muteBtn.setAttribute(
          "aria-label",
          muted ? "Unmute music" : "Mute music",
        );
      }
      showMute();

      /* ===== music: a jaunty "pumpkin parade" march in B minor ===== */
      var ctx = null,
        master = null,
        sfxGain = null,
        timer = null,
        started = false;
      var events = [],
        evIndex = 0,
        loopStart = 0,
        beat = 60 / TEMPO_BPM,
        LOOP_BEATS = 32;
      function hz(m) {
        return 440 * Math.pow(2, (m - 69) / 12);
      }

      (function buildSong() {
        // Bm G D A | Bm G A Bm
        var roots = [47, 43, 50, 45, 47, 43, 45, 47];
        var chords = [
          [62, 66, 69],
          [62, 67, 71],
          [62, 66, 69],
          [61, 64, 69],
          [62, 66, 69],
          [62, 67, 71],
          [61, 64, 69],
          [62, 66, 69],
        ];
        for (var b = 0; b < 8; b++) {
          var t = b * 4;
          events.push({ t: t, m: [roots[b]], d: 0.8, v: 0.6, w: "sine" });
          events.push({ t: t + 2, m: [roots[b]], d: 0.8, v: 0.5, w: "sine" });
          events.push({
            t: t + 1,
            m: chords[b],
            d: 0.3,
            v: 0.14,
            w: "triangle",
          });
          events.push({
            t: t + 3,
            m: chords[b],
            d: 0.3,
            v: 0.14,
            w: "triangle",
          });
        }
        var mel = [
          [0, 78, 0.5],
          [0.5, 81, 0.5],
          [1, 83, 1],
          [2, 81, 0.5],
          [2.5, 78, 0.5],
          [3, 76, 1],
          [4, 79, 0.5],
          [4.5, 78, 0.5],
          [5, 74, 1],
          [6, 79, 1],
          [7, 83, 1],
          [8, 81, 0.5],
          [8.5, 78, 0.5],
          [9, 74, 1],
          [10, 78, 1],
          [11, 81, 1],
          [12, 81, 0.5],
          [12.5, 80, 0.5],
          [13, 76, 1],
          [14, 73, 1],
          [15, 76, 1],
          [16, 78, 0.5],
          [16.5, 81, 0.5],
          [17, 83, 1],
          [18, 86, 1],
          [19, 83, 1],
          [20, 86, 0.5],
          [20.5, 83, 0.5],
          [21, 79, 1],
          [22, 74, 1],
          [23, 79, 1],
          [24, 76, 0.5],
          [24.5, 78, 0.5],
          [25, 81, 1],
          [26, 80, 1],
          [27, 76, 1],
          [28, 78, 2],
          [30, 71, 1],
        ];
        mel.forEach(function (n) {
          events.push({
            t: n[0],
            m: [n[1]],
            d: n[2] * 0.9,
            v: 0.4,
            w: "triangle",
            pluck: true,
          });
        });
        events.sort(function (a, b) {
          return a.t - b.t;
        });
      })();

      function playNote(freq, when, durBeats, vol, wave, pluck) {
        var dur = durBeats * beat;
        var o = ctx.createOscillator(),
          g = ctx.createGain();
        o.type = wave;
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, when);
        g.gain.linearRampToValueAtTime(vol, when + 0.012);
        g.gain.exponentialRampToValueAtTime(
          0.0001,
          when + dur + (pluck ? 0.18 : 0.25),
        );
        o.connect(g);
        g.connect(master);
        o.start(when);
        o.stop(when + dur + 0.4);
      }
      function schedule() {
        if (!ctx) return;
        while (true) {
          var e = events[evIndex];
          var when = loopStart + e.t * beat;
          if (when > ctx.currentTime + 0.5) break;
          if (when >= ctx.currentTime - 0.05) {
            for (var i = 0; i < e.m.length; i++)
              playNote(hz(e.m[i]), when, e.d, e.v, e.w, e.pluck);
          }
          evIndex++;
          if (evIndex >= events.length) {
            evIndex = 0;
            loopStart += LOOP_BEATS * beat;
          }
        }
      }
      function startMusic() {
        if (started) {
          if (ctx && ctx.state === "suspended") ctx.resume();
          return;
        }
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = muted ? 0 : MUSIC_VOLUME;
        master.connect(ctx.destination);
        sfxGain = ctx.createGain();
        sfxGain.gain.value = muted ? 0 : SFX_VOLUME;
        sfxGain.connect(ctx.destination);
        loopStart = ctx.currentTime + 0.2;
        evIndex = 0;
        timer = setInterval(schedule, 100);
        started = true;
        if (ctx.state === "suspended") ctx.resume();
      }
      /* music starts on the first tap (browsers need a tap) */
      function firstTap() {
        document.removeEventListener("click", firstTap, true);
        document.removeEventListener("touchend", firstTap, true);
        if (!muted) startMusic();
      }
      document.addEventListener("click", firstTap, true);
      document.addEventListener("touchend", firstTap, true);

      muteBtn.addEventListener("click", function () {
        muted = !muted;
        try {
          localStorage.setItem("halloweenMuted", muted ? "1" : "0");
        } catch (e) {}
        showMute();
        if (!muted && !started) startMusic();
        if (ctx) {
          master.gain.setTargetAtTime(
            muted ? 0 : MUSIC_VOLUME,
            ctx.currentTime,
            0.05,
          );
          sfxGain.gain.setTargetAtTime(
            muted ? 0 : SFX_VOLUME,
            ctx.currentTime,
            0.05,
          );
        }
      });
      document.addEventListener("visibilitychange", function () {
        if (!ctx) return;
        if (document.hidden) ctx.suspend();
        else ctx.resume();
      });

      /* small "pop" when a worksheet button is tapped */
      function pop() {
        if (!ctx || muted) return;
        var t = ctx.currentTime;
        [659, 880].forEach(function (f, i) {
          var o = ctx.createOscillator(),
            g = ctx.createGain();
          o.type = "triangle";
          o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t + i * 0.08);
          g.gain.linearRampToValueAtTime(1, t + i * 0.08 + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.08 + 0.2);
          o.connect(g);
          g.connect(sfxGain);
          o.start(t + i * 0.08);
          o.stop(t + i * 0.08 + 0.25);
        });
      }
      Array.prototype.forEach.call(
        document.querySelectorAll("a.card"),
        function (a) {
          a.addEventListener("click", pop);
        },
      );

      document.getElementById("back").addEventListener("click", function () {
        location.href = "index.html";
      });
    </script>
  </body>
</html>
