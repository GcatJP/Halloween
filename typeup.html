<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Type up</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#2a1250" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Halloween" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="images/icon.png" />
    <link rel="icon" type="image/png" href="images/icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg1: #2a1250;
        --bg2: #4a1c78;
        --bg3: #7a2f8f;
        --orange: #ff9a1f;
        --yellow: #ffe066;
        --white: #fff8ee;
        --green: #58d46a;
        --red: #ff4d4d;
        --font:
          "Fredoka", "Chalkboard SE", "Hiragino Maru Gothic ProN",
          "Comic Sans MS", system-ui, sans-serif;
        --top: calc(env(safe-area-inset-top, 0px) + 70px);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--bg1);
        font-family: var(--font);
        color: var(--white);
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
      }
      body {
        background: radial-gradient(
          circle at 50% 0%,
          var(--bg3) 0%,
          var(--bg2) 40%,
          var(--bg1) 100%
        );
      }
      input {
        -webkit-user-select: text;
        user-select: text;
      }

      /* ---------- decorations ---------- */
      .star {
        position: fixed;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fff;
        opacity: 0.7;
        animation: twinkle 3s infinite ease-in-out;
        z-index: 0;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.2;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.3);
        }
      }

      /* app box (follows the visible area when the keyboard is open) */
      #app {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        overflow: hidden;
      }

      /* ---------- top buttons ---------- */
      .round {
        position: absolute;
        z-index: 30;
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        width: clamp(46px, 8vmin, 60px);
        height: clamp(46px, 8vmin, 60px);
        border-radius: 50%;
        border: 3px solid #fff;
        background: var(--orange);
        font-size: clamp(22px, 4.2vmin, 32px);
        cursor: pointer;
        color: #fff;
        font-family: var(--font);
        font-weight: 700;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .round:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }
      #back {
        left: calc(env(safe-area-inset-left, 0px) + 12px);
      }
      #mute {
        right: calc(env(safe-area-inset-right, 0px) + 12px);
      }
      #mute.off {
        background: #6b5a85;
      }

      /* ---------- screens ---------- */
      .screen {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: var(--top) calc(env(safe-area-inset-right, 0px) + 14px)
          calc(env(safe-area-inset-bottom, 0px) + 10px)
          calc(env(safe-area-inset-left, 0px) + 14px);
        gap: 3vmin;
        text-align: center;
      }
      .screen.active {
        display: flex;
      }
      h1 {
        font-size: clamp(30px, 8vmin, 64px);
        line-height: 1.05;
        color: var(--orange);
        font-weight: 700;
        text-shadow:
          0 3px 0 #7a2f00,
          0 0 24px rgba(255, 154, 31, 0.5);
      }
      .sub {
        font-size: clamp(16px, 3.6vmin, 28px);
        color: var(--yellow);
        font-weight: 500;
      }

      .choices {
        display: flex;
        gap: clamp(12px, 3vmin, 28px);
        flex-wrap: wrap;
        justify-content: center;
        width: min(94vw, 900px);
      }
      .big {
        font-family: var(--font);
        color: #fff;
        cursor: pointer;
        border: 4px solid rgba(255, 255, 255, 0.9);
        border-radius: clamp(20px, 4vmin, 34px);
        padding: clamp(12px, 2.6vmin, 26px) clamp(18px, 4vmin, 40px);
        min-width: clamp(150px, 30vmin, 260px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6vmin;
        box-shadow:
          0 8px 0 rgba(0, 0, 0, 0.35),
          0 14px 26px rgba(0, 0, 0, 0.3);
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      .big:active {
        transform: translateY(6px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
      }
      .big b {
        font-size: clamp(24px, 5.4vmin, 46px);
        font-weight: 700;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
      }
      .big small {
        font-size: clamp(13px, 2.6vmin, 21px);
        font-weight: 500;
        opacity: 0.95;
      }
      .big .pic {
        height: clamp(40px, 10vmin, 80px);
        width: auto;
        filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.35));
      }
      .easy {
        background: linear-gradient(160deg, #6fdc6f, #2a9d43);
      }
      .hard {
        background: linear-gradient(160deg, #a66bff, #6a35c9);
      }
      .orange {
        background: linear-gradient(160deg, #ffb23f, #f0720a);
      }

      /* ---------- game ---------- */
      #game {
        justify-content: flex-start;
        gap: 1.2vmin;
        padding-top: calc(var(--top) - 8px);
      }
      #hud {
        display: flex;
        gap: clamp(8px, 2.4vmin, 26px);
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        font-size: clamp(15px, 3.2vmin, 26px);
        font-weight: 700;
        color: var(--yellow);
      }
      #hud span {
        background: rgba(0, 0, 0, 0.25);
        border-radius: 30px;
        padding: 3px 16px;
        white-space: nowrap;
      }
      #play {
        flex: 1;
        min-height: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.4vmin;
      }
      #picBox {
        flex: 1;
        min-height: 0;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      #pic {
        max-width: 92%;
        max-height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.4));
        animation: pop 0.45s;
      }
      @keyframes pop {
        0% {
          transform: scale(0.7);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      #missing {
        display: none;
        font-size: clamp(14px, 3vmin, 22px);
        color: var(--yellow);
        background: rgba(0, 0, 0, 0.3);
        border-radius: 14px;
        padding: 10px 16px;
      }
      #ctrl {
        width: min(94vw, 640px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.4vmin;
        flex: none;
      }

      #entry {
        display: flex;
        gap: 10px;
        width: 100%;
      }
      #ans {
        flex: 1;
        min-width: 0;
        font-family: var(--font);
        font-weight: 700;
        font-size: max(16px, clamp(22px, 5vmin, 40px));
        text-align: center;
        padding: 0.35em 0.5em;
        border-radius: 20px;
        border: 4px solid #fff;
        background: #fffaf0;
        color: #3a1a60;
        outline: none;
      }
      #ans:focus {
        border-color: var(--orange);
        box-shadow: 0 0 0 4px rgba(255, 154, 31, 0.4);
      }
      #ans.shake {
        animation: shake 0.35s;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-8px);
        }
        75% {
          transform: translateX(8px);
        }
      }
      #go {
        font-family: var(--font);
        font-weight: 700;
        font-size: clamp(18px, 4vmin, 32px);
        color: #fff;
        cursor: pointer;
        padding: 0 clamp(14px, 3vmin, 28px);
        border-radius: 20px;
        border: 4px solid #fff;
        background: linear-gradient(160deg, #6fdc6f, #2a9d43);
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.35);
      }
      #go:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }

      #fb {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 1.2vmin;
        width: 100%;
      }
      #fb.show {
        display: flex;
      }
      #ctrl.retry #fb {
        order: -1;
      }
      #tiles {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 4px;
      }
      .tile {
        width: min(8vw, 6.5vh, 48px);
        height: min(10vw, 8vh, 58px);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: min(6vw, 5vh, 34px);
        border-radius: 10px;
        border: 3px solid #fff;
        color: #fff;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
        animation: pop 0.3s backwards;
      }
      .tile.ok {
        background: #2fa84a;
      }
      .tile.bad {
        background: var(--red);
        border-color: #ffd0d0;
      }
      .tile.miss {
        background: transparent;
        border: 3px dashed var(--red);
        color: var(--red);
        box-shadow: none;
      }
      .tile.sp {
        width: min(4vw, 3.5vh, 22px);
      }
      #fbMsg {
        font-size: clamp(16px, 3.6vmin, 28px);
        font-weight: 700;
      }
      #fbMsg.good {
        color: var(--green);
      }
      #fbMsg.bad {
        color: var(--yellow);
      }
      #fbMsg .right {
        color: #fff;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 14px;
        padding: 2px 14px;
        margin-left: 6px;
      }
      #next {
        font-family: var(--font);
        font-weight: 700;
        font-size: clamp(20px, 4.4vmin, 34px);
        color: #fff;
        cursor: pointer;
        padding: 0.3em 1.6em;
        border-radius: 50px;
        border: 4px solid #fff;
        background: linear-gradient(160deg, #ffb23f, #f0720a);
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35);
      }
      #next:active {
        transform: translateY(5px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }

      /* landscape: picture on the left, controls on the right */
      @media (orientation: landscape) {
        #play {
          flex-direction: row;
          gap: 3vw;
        }
        #picBox {
          flex: 1.1;
          height: 100%;
        }
        #ctrl {
          flex: 1;
          width: auto;
          justify-content: center;
          height: 100%;
        }
        .tile {
          width: min(5vw, 9vh, 44px);
          height: min(6.5vw, 11vh, 54px);
          font-size: min(4vw, 6vh, 30px);
        }
        .tile.sp {
          width: min(2.4vw, 4vh, 20px);
        }
      }
      @media (orientation: landscape) and (max-height: 500px) {
        .screen {
          gap: 1.6vh;
        }
        h1 {
          font-size: clamp(24px, 10vh, 50px);
        }
        .sub {
          font-size: clamp(13px, 5vh, 22px);
        }
      }

      /* ---------- results ---------- */
      #result {
        justify-content: flex-start;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        gap: 2vmin;
        padding-bottom: 30px;
      }
      #result h1 {
        margin-top: auto;
      }
      .stars {
        font-size: clamp(34px, 8vmin, 64px);
        letter-spacing: 6px;
      }
      .stats {
        display: flex;
        gap: clamp(10px, 3vmin, 30px);
        flex-wrap: wrap;
        justify-content: center;
      }
      .stat {
        background: rgba(0, 0, 0, 0.28);
        border-radius: 24px;
        padding: clamp(8px, 1.6vmin, 16px) clamp(18px, 4vmin, 40px);
        min-width: clamp(120px, 26vmin, 220px);
      }
      .stat small {
        display: block;
        font-size: clamp(13px, 2.6vmin, 20px);
        color: var(--yellow);
        font-weight: 500;
      }
      .stat b {
        font-size: clamp(28px, 7vmin, 56px);
        font-weight: 700;
      }
      #wrongTitle {
        font-size: clamp(18px, 4vmin, 30px);
        color: var(--yellow);
        font-weight: 700;
        margin-top: 1vmin;
      }
      #wrongList {
        display: grid;
        grid-template-columns: repeat(
          auto-fill,
          minmax(clamp(130px, 26vmin, 190px), 1fr)
        );
        gap: 12px;
        width: min(96vw, 900px);
      }
      .wrongCard {
        background: #fffaf0;
        border-radius: 20px;
        border: 3px solid var(--red);
        padding: 8px 6px 10px;
        color: #3a1a60;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      .wrongCard img {
        width: 70%;
        height: clamp(60px, 14vmin, 110px);
        object-fit: contain;
      }
      .wrongCard .w {
        font-size: clamp(17px, 3.4vmin, 26px);
        font-weight: 700;
        color: #1f8a3a;
      }
      .wrongCard .t {
        font-size: clamp(13px, 2.6vmin, 19px);
        font-weight: 500;
        color: var(--red);
        text-decoration: line-through;
        min-height: 1.2em;
      }
      #perfect {
        font-size: clamp(20px, 4.6vmin, 34px);
        color: var(--green);
        font-weight: 700;
      }
      #result .choices {
        margin-top: 1vmin;
        margin-bottom: auto;
      }
      #result .choices .big {
        min-width: clamp(130px, 24vmin, 210px);
        padding: clamp(10px, 2vmin, 18px) clamp(14px, 3vmin, 30px);
      }
      .fall {
        position: absolute;
        top: -60px;
        font-size: clamp(24px, 5vmin, 44px);
        animation: fall linear forwards;
        pointer-events: none;
        z-index: 5;
      }
      @keyframes fall {
        to {
          transform: translateY(115vh) rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="sky"></div>

    <div id="app">
      <button id="back" class="round" aria-label="Back">&#8592;</button>
      <button
        id="mute"
        class="round"
        aria-label="Mute music"
        title="Music on/off"
      >
        🔊
      </button>

      <!-- screen 1: mode -->
      <section id="modeScreen" class="screen active">
        <h1>Type up!</h1>
        <div class="sub">Look at the picture and spell the word</div>
        <div class="choices">
          <button class="big easy" id="btnEasy">
            <img class="pic" src="images/pumpkin.png" alt="" />
            <b>Easy</b><small>9 words</small>
          </button>
          <button class="big hard" id="btnHard">
            <img class="pic" src="images/black-cat.png" alt="" />
            <b>Difficult</b><small>18 words</small>
          </button>
        </div>
      </section>

      <!-- screen 2: game -->
      <section id="game" class="screen">
        <div id="hud">
          <span id="hudWord">Word 1/9</span><span id="hudScore">⭐ 0</span
          ><span id="hudTime">⏱ 0:00</span>
        </div>
        <div id="play">
          <div id="picBox">
            <img id="pic" alt="" />
            <div id="missing"></div>
          </div>
          <div id="ctrl">
            <div id="entry">
              <input
                id="ans"
                type="text"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                enterkeyhint="done"
                placeholder="Type here..."
                aria-label="Type the word"
              />
              <button id="go">Check</button>
            </div>
            <div id="fb">
              <div id="tiles"></div>
              <div id="fbMsg"></div>
              <button id="next">Next</button>
            </div>
          </div>
        </div>
      </section>

      <!-- screen 3: results -->
      <section id="result" class="screen">
        <h1 id="resTitle">Great job!</h1>
        <div class="stars" id="resStars"></div>
        <div class="stats">
          <div class="stat"><small>Score</small><b id="resScore">0/9</b></div>
          <div class="stat"><small>Time</small><b id="resTime">0:00</b></div>
        </div>
        <div id="wrongTitle"></div>
        <div id="perfect" style="display: none">Perfect spelling! 🎃</div>
        <div id="wrongList"></div>
        <div class="choices">
          <button class="big orange" id="btnAgain"><b>Play again</b></button>
          <button class="big hard" id="btnModes"><b>Modes</b></button>
        </div>
      </section>
    </div>

    <script>
      /* ===== settings ===== */
      var MUSIC_VOLUME = 0.1; // background music level (0 to 1)
      var SFX_VOLUME = 0.25; // jingle level
      var TEMPO_BPM = 104;
      var EASY_WORDS = 9;
      var IMG_FOLDER = "images/";

      /* word shown/typed, image file inside the images folder */
      var ITEMS = [
        ["witch", "witch.png"],
        ["ghost", "ghost.png"],
        ["pumpkin", "pumpkin.png"],
        ["skeleton", "skeleton.png"],
        ["vampire", "vampire.png"],
        ["black cat", "black-cat.png"],
        ["werewolf", "werewolf.png"],
        ["spider", "spider.png"],
        ["zombie", "zombie.png"],
        ["bat", "bat.png"],
        ["haunted house", "haunted-house.png"],
        ["monster", "monster.png"],
        ["mummy", "mummy.png"],
        ["spider web", "spider-web.png"],
        ["scary", "scary.png"],
        ["crow", "crow.png"],
        ["owl", "owl.png"],
        ["moon", "moon.png"],
      ];

      /* ===== stars ===== */
      (function () {
        var sky = document.getElementById("sky");
        for (var i = 0; i < 26; i++) {
          var s = document.createElement("div");
          s.className = "star";
          s.style.left = Math.random() * 100 + "vw";
          s.style.top = Math.random() * 90 + "vh";
          s.style.animationDelay = -Math.random() * 3 + "s";
          sky.appendChild(s);
        }
      })();

      /* ===== keep the page inside the visible area when the keyboard opens ===== */
      var app = document.getElementById("app");
      function fit() {
        var vv = window.visualViewport;
        if (vv) {
          app.style.height = vv.height + "px";
          app.style.top = vv.offsetTop + "px";
        } else {
          app.style.height = window.innerHeight + "px";
        }
      }
      if (window.visualViewport) {
        visualViewport.addEventListener("resize", fit);
        visualViewport.addEventListener("scroll", fit);
      }
      window.addEventListener("resize", fit);
      window.addEventListener("orientationchange", function () {
        setTimeout(fit, 250);
      });
      fit();

      /* ===== mute state (shared with the other pages) ===== */
      var muted = false;
      try {
        muted = localStorage.getItem("halloweenMuted") === "1";
      } catch (e) {}
      var muteBtn = document.getElementById("mute");
      function showMute() {
        muteBtn.textContent = muted ? "🔇" : "🔊";
        muteBtn.classList.toggle("off", muted);
        muteBtn.setAttribute(
          "aria-label",
          muted ? "Unmute music" : "Mute music",
        );
      }
      showMute();

      /* ===== audio ===== */
      var ctx = null,
        master = null,
        sfxGain = null,
        timer = null,
        started = false;
      var events = [],
        evIndex = 0,
        loopStart = 0,
        beat = 60 / TEMPO_BPM,
        LOOP_BEATS = 32;
      function hz(m) {
        return 440 * Math.pow(2, (m - 69) / 12);
      }

      (function buildSong() {
        // "Creepy-cute" E minor tune: Em Em C B | Em Am B Em
        var roots = [52, 52, 48, 47, 52, 45, 47, 52];
        var chords = [
          [64, 67, 71],
          [64, 67, 71],
          [64, 67, 72],
          [63, 66, 71],
          [64, 67, 71],
          [64, 69, 72],
          [63, 66, 71],
          [64, 67, 71],
        ];
        for (var b = 0; b < 8; b++) {
          var t = b * 4;
          events.push({ t: t, m: [roots[b]], d: 0.8, v: 0.6, w: "sine" });
          events.push({ t: t + 2, m: [roots[b]], d: 0.8, v: 0.5, w: "sine" });
          events.push({
            t: t + 1,
            m: chords[b],
            d: 0.3,
            v: 0.15,
            w: "triangle",
          });
          events.push({
            t: t + 3,
            m: chords[b],
            d: 0.3,
            v: 0.15,
            w: "triangle",
          });
        }
        var mel = [
          [0, 76, 0.5],
          [0.5, 79, 0.5],
          [1, 83, 1],
          [2, 79, 0.5],
          [2.5, 76, 0.5],
          [3, 75, 1],
          [4, 76, 0.5],
          [4.5, 79, 0.5],
          [5, 83, 1],
          [6, 86, 1],
          [7, 83, 1],
          [8, 84, 0.5],
          [8.5, 83, 0.5],
          [9, 79, 1],
          [10, 76, 1],
          [11, 79, 1],
          [12, 78, 0.5],
          [12.5, 75, 0.5],
          [13, 78, 1],
          [14, 81, 1],
          [15, 78, 1],
          [16, 76, 0.5],
          [16.5, 79, 0.5],
          [17, 83, 1],
          [18, 86, 0.5],
          [18.5, 83, 0.5],
          [19, 79, 1],
          [20, 81, 0.5],
          [20.5, 84, 0.5],
          [21, 84, 1],
          [22, 81, 1],
          [23, 76, 1],
          [24, 75, 0.5],
          [24.5, 78, 0.5],
          [25, 81, 1],
          [26, 78, 1],
          [27, 75, 1],
          [28, 76, 2],
          [30, 71, 1],
        ];
        mel.forEach(function (n) {
          events.push({
            t: n[0],
            m: [n[1]],
            d: n[2] * 0.9,
            v: 0.4,
            w: "triangle",
            pluck: true,
          });
        });
        events.sort(function (a, b) {
          return a.t - b.t;
        });
      })();

      function playNote(freq, when, durBeats, vol, wave, pluck) {
        var dur = durBeats * beat;
        var o = ctx.createOscillator(),
          g = ctx.createGain();
        o.type = wave;
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, when);
        g.gain.linearRampToValueAtTime(vol, when + 0.012);
        g.gain.exponentialRampToValueAtTime(
          0.0001,
          when + dur + (pluck ? 0.18 : 0.25),
        );
        o.connect(g);
        g.connect(master);
        o.start(when);
        o.stop(when + dur + 0.4);
      }
      function schedule() {
        if (!ctx) return;
        while (true) {
          var e = events[evIndex];
          var when = loopStart + e.t * beat;
          if (when > ctx.currentTime + 0.5) break;
          if (when >= ctx.currentTime - 0.05) {
            for (var i = 0; i < e.m.length; i++)
              playNote(hz(e.m[i]), when, e.d, e.v, e.w, e.pluck);
          }
          evIndex++;
          if (evIndex >= events.length) {
            evIndex = 0;
            loopStart += LOOP_BEATS * beat;
          }
        }
      }
      function startMusic() {
        if (started) {
          if (ctx && ctx.state === "suspended") ctx.resume();
          return;
        }
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = muted ? 0 : MUSIC_VOLUME;
        master.connect(ctx.destination);
        sfxGain = ctx.createGain();
        sfxGain.gain.value = muted ? 0 : SFX_VOLUME;
        sfxGain.connect(ctx.destination);
        loopStart = ctx.currentTime + 0.2;
        evIndex = 0;
        timer = setInterval(schedule, 100);
        started = true;
        if (ctx.state === "suspended") ctx.resume();
      }
      /* music starts on the first tap (browsers need a tap) */
      function firstTap() {
        document.removeEventListener("click", firstTap, true);
        document.removeEventListener("touchend", firstTap, true);
        if (!muted) startMusic();
      }
      document.addEventListener("click", firstTap, true);
      document.addEventListener("touchend", firstTap, true);

      muteBtn.addEventListener("click", function () {
        muted = !muted;
        try {
          localStorage.setItem("halloweenMuted", muted ? "1" : "0");
        } catch (e) {}
        showMute();
        if (!muted && !started) startMusic();
        if (ctx) {
          master.gain.setTargetAtTime(
            muted ? 0 : MUSIC_VOLUME,
            ctx.currentTime,
            0.05,
          );
          sfxGain.gain.setTargetAtTime(
            muted ? 0 : SFX_VOLUME,
            ctx.currentTime,
            0.05,
          );
        }
      });
      document.addEventListener("visibilitychange", function () {
        if (!ctx) return;
        if (document.hidden) ctx.suspend();
        else ctx.resume();
      });

      /* one sound: freq, delay, length, wave, volume, optional glide-to freq */
      function blip(freq, delay, dur, type, vol, glideTo) {
        if (!ctx || muted) return;
        var t = ctx.currentTime + (delay || 0);
        var o = ctx.createOscillator(),
          g = ctx.createGain(),
          out = g;
        o.type = type || "sine";
        o.frequency.setValueAtTime(freq, t);
        if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol || 1, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        if (type === "sawtooth") {
          // soften the buzzy sound
          var f = ctx.createBiquadFilter();
          f.type = "lowpass";
          f.frequency.value = 900;
          o.connect(f);
          f.connect(g);
        } else o.connect(g);
        out.connect(sfxGain);
        o.start(t);
        o.stop(t + dur + 0.05);
      }
      /* happy jingle: bouncy rising notes with a sparkle */
      function jingleHappy() {
        var n = [523, 659, 784, 1047, 988, 1047, 1319];
        var d = [0, 0.11, 0.22, 0.33, 0.5, 0.6, 0.72];
        n.forEach(function (f, i) {
          blip(f, d[i], i === 6 ? 0.5 : 0.2, "triangle", 1);
        });
        blip(2093, 0.72, 0.4, "sine", 0.25);
        blip(1568, 0.8, 0.4, "sine", 0.2);
      }
      /* bad jingle: wobbly falling "wah-wah-waaah" */
      function jingleBad() {
        blip(392, 0, 0.22, "sawtooth", 0.55, 370);
        blip(349, 0.25, 0.22, "sawtooth", 0.55, 330);
        blip(311, 0.5, 0.22, "sawtooth", 0.55, 294);
        blip(262, 0.75, 0.8, "sawtooth", 0.6, 130);
        blip(98, 0.75, 0.8, "sine", 0.5, 60);
      }
      function jingleWin() {
        [523, 659, 784, 1047, 784, 1047, 1319].forEach(function (f, i) {
          blip(f, i * 0.14, 0.3, "triangle", 1);
        });
      }

      /* ===== screens ===== */
      var screens = { mode: "modeScreen", game: "game", result: "result" };
      var current = "mode";
      function show(name) {
        current = name;
        for (var k in screens)
          document
            .getElementById(screens[k])
            .classList.toggle("active", k === name);
        if (name !== "game") stopClock();
        if (name !== "result") clearConfetti();
      }
      document.getElementById("back").addEventListener("click", function () {
        if (current === "mode") location.href = "index.html";
        else show("mode");
      });
      document.getElementById("btnEasy").addEventListener("click", function () {
        startGame("easy");
      });
      document.getElementById("btnHard").addEventListener("click", function () {
        startGame("hard");
      });
      document
        .getElementById("btnAgain")
        .addEventListener("click", function () {
          startGame(mode);
        });
      document
        .getElementById("btnModes")
        .addEventListener("click", function () {
          show("mode");
        });

      /* ===== game ===== */
      var mode = "easy",
        words = [],
        idx = 0,
        score = 0,
        wrongs = [],
        t0 = 0,
        clock = null,
        checked = false,
        retrying = false;
      var $ = function (id) {
        return document.getElementById(id);
      };
      var ans = $("ans"),
        pic = $("pic"),
        missing = $("missing");

      function shuffle(a) {
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;
      }
      function fmt(ms) {
        var s = Math.floor(ms / 1000),
          m = Math.floor(s / 60);
        s = s % 60;
        return m + ":" + (s < 10 ? "0" : "") + s;
      }
      function tick() {
        $("hudTime").textContent = "⏱ " + fmt(Date.now() - t0);
      }
      function stopClock() {
        if (clock) {
          clearInterval(clock);
          clock = null;
        }
      }

      function startGame(m) {
        mode = m;
        words = shuffle(ITEMS.slice());
        if (m === "easy") words = words.slice(0, EASY_WORDS);
        idx = 0;
        score = 0;
        wrongs = [];
        show("game");
        t0 = Date.now();
        tick();
        stopClock();
        clock = setInterval(tick, 500);
        showWord();
      }

      function showWord() {
        var cur = words[idx];
        checked = false;
        retrying = false;
        missing.style.display = "none";
        pic.style.display = "";
        pic.onerror = function () {
          pic.style.display = "none";
          missing.textContent = "Image not found: " + IMG_FOLDER + cur[1];
          missing.style.display = "block";
        };
        pic.style.animation = "none";
        void pic.offsetWidth;
        pic.style.animation = "";
        pic.src = IMG_FOLDER + cur[1];
        ans.value = "";
        $("entry").style.display = "flex";
        $("fb").classList.remove("show");
        $("ctrl").classList.remove("retry");
        $("next").style.display = "";
        ans.placeholder = "Type here...";
        $("hudWord").textContent = "Word " + (idx + 1) + "/" + words.length;
        $("hudScore").textContent = "⭐ " + score;
        ans.focus();
      }

      function norm(s) {
        return s.toLowerCase().replace(/\s+/g, " ").trim();
      }

      function buildTiles(typed, answer) {
        /* right = green, wrong or extra = red, missing = red dashes */
        var tiles = $("tiles");
        tiles.innerHTML = "";
        var n = Math.max(typed.length, answer.length);
        for (var i = 0; i < n; i++) {
          var t = typed.charAt(i),
            a = answer.charAt(i);
          var el = document.createElement("div");
          el.style.animationDelay = i * 0.04 + "s";
          if (t === "") {
            el.className = "tile miss";
            el.textContent = "_";
          } else {
            el.className = "tile " + (t === a ? "ok" : "bad");
            if (t === " ") {
              el.classList.add("sp");
              el.textContent = "\u00A0";
            } else el.textContent = t;
          }
          tiles.appendChild(el);
        }
      }

      function check() {
        if (checked) return;
        var typed = norm(ans.value);
        if (!typed) {
          ans.classList.remove("shake");
          void ans.offsetWidth;
          ans.classList.add("shake");
          return;
        }
        var cur = words[idx],
          answer = cur[0];
        var ok = typed === answer;
        var msg = $("fbMsg");
        buildTiles(typed, answer);

        if (ok) {
          checked = true;
          if (!retrying) {
            score++;
            msg.className = "good";
            msg.textContent = "Correct! 🎉";
          } else {
            msg.className = "good";
            msg.textContent = "Well done! 🎉";
          }
          jingleHappy();
          $("hudScore").textContent = "⭐ " + score;
          $("next").textContent = idx >= words.length - 1 ? "Finish" : "Next";
          $("next").style.display = "";
          ans.blur();
          $("entry").style.display = "none";
          $("ctrl").classList.remove("retry");
          $("fb").classList.add("show");
        } else {
          /* wrong: show the mistakes now and make them type it correctly */
          if (!retrying) {
            wrongs.push({ name: answer, file: cur[1], typed: typed });
            retrying = true;
          }
          msg.className = "bad";
          msg.innerHTML = "";
          msg.appendChild(document.createTextNode("Correct spelling:"));
          var r = document.createElement("span");
          r.className = "right";
          r.textContent = answer;
          msg.appendChild(r);
          jingleBad();
          $("next").style.display = "none";
          $("ctrl").classList.add("retry");
          $("fb").classList.add("show");
          $("entry").style.display = "flex";
          ans.value = "";
          ans.placeholder = "Type it correctly...";
          ans.focus();
        }
      }

      function next() {
        if (!checked) return;
        idx++;
        if (idx >= words.length) finish();
        else showWord();
      }

      $("go").addEventListener("click", check);
      $("next").addEventListener("click", next);
      ans.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          e.stopPropagation();
          check();
        }
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && current === "game" && checked) {
          e.preventDefault();
          next();
        }
      });

      /* ===== results ===== */
      function finish() {
        stopClock();
        var total = words.length,
          ms = Date.now() - t0;
        var pct = score / total;
        $("resScore").textContent = score + "/" + total;
        $("resTime").textContent = fmt(ms);
        $("resTitle").textContent =
          pct === 1 ? "Perfect!" : pct >= 0.6 ? "Great job!" : "Good try!";
        var stars = pct >= 0.9 ? 3 : pct >= 0.6 ? 2 : 1,
          s = "";
        for (var i = 0; i < 3; i++) s += i < stars ? "⭐" : "☆";
        $("resStars").textContent = s;

        var list = $("wrongList");
        list.innerHTML = "";
        if (wrongs.length) {
          $("wrongTitle").textContent = "Words to practise:";
          $("perfect").style.display = "none";
          wrongs.forEach(function (w) {
            var c = document.createElement("div");
            c.className = "wrongCard";
            var im = document.createElement("img");
            im.alt = "";
            im.src = IMG_FOLDER + w.file;
            im.onerror = function () {
              im.style.visibility = "hidden";
            };
            var a = document.createElement("div");
            a.className = "w";
            a.textContent = w.name;
            var b = document.createElement("div");
            b.className = "t";
            b.textContent = w.typed;
            c.appendChild(im);
            c.appendChild(a);
            c.appendChild(b);
            list.appendChild(c);
          });
        } else {
          $("wrongTitle").textContent = "";
          $("perfect").style.display = "block";
        }
        show("result");
        $("result").scrollTop = 0;
        jingleWin();
        confetti();
      }
      function confetti() {
        var box = $("result"),
          em = ["🎃", "👻", "🦇", "⭐", "🍬", "🕷️"];
        for (var i = 0; i < 24; i++) {
          var s = document.createElement("div");
          s.className = "fall";
          s.textContent = em[i % em.length];
          s.style.left = Math.random() * 100 + "%";
          s.style.animationDuration = 3 + Math.random() * 3 + "s";
          s.style.animationDelay = Math.random() * 2 + "s";
          box.appendChild(s);
        }
      }
      function clearConfetti() {
        Array.prototype.forEach.call(
          document.querySelectorAll(".fall"),
          function (n) {
            n.remove();
          },
        );
      }

      /* preload images quietly */
      ITEMS.forEach(function (it) {
        var im = new Image();
        im.src = IMG_FOLDER + it[1];
      });
    </script>
  </body>
</html>
